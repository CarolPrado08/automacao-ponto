name: Registro de Ponto Tangerino / Sólides

on:
  schedule:
    # Horários UTC calibrados para o fuso do Brasil (UTC-3):
    - cron: '30 11 * * 1-5'  # Entrada: 08:30 BRT
    - cron: '0 16 * * 1-5'   # Almoço: 13:00 BRT
    - cron: '0 17 * * 1-5'   # Volta Almoço: 14:00 BRT
    - cron: '18 21 * * 1-5'  # Saída: 18:18 BRT
  workflow_dispatch:

jobs:
  ponto:
    runs-on: ubuntu-latest
    # Define formalmente o fuso horário do ambiente como America/Sao_Paulo
    env:
      TZ: "America/Sao_Paulo"
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências e Navegador
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Executar Registro de Ponto
        env:
          SOLIDES_COMPANY_CODE: ${{ secrets.SOLIDES_COMPANY_CODE }}
          SOLIDES_PIN: ${{ secrets.SOLIDES_PIN }}
        run: python bater_ponto.py

      - name: Salvar Comprovante (Print)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprovante-ponto-${{ github.run_id }}
          path: comprovante_ponto.png
