name: Registro de Ponto Tangerino / Sólides

on:
  workflow_dispatch:

jobs:
  ponto:
    runs-on: ubuntu-latest
    env:
      TZ: "America/Sao_Paulo"
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache do Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Instalar Dependências
        run: |
          pip install playwright
          playwright install chromium

      - name: Executar Registro de Ponto
        env:
          SOLIDES_COMPANY_CODE: ${{ secrets.SOLIDES_COMPANY_CODE }}
          SOLIDES_PIN: ${{ secrets.SOLIDES_PIN }}
        run: python bater_ponto.py

      - name: Salvar Comprovante (Print)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprovante-ponto-${{ github.run_id }}
          path: comprovante_ponto.png
