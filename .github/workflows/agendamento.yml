name: Registro de Ponto Tangerino / Sólides

on:
  workflow_dispatch:        # Disparado via API do Cron-job.org ou manualmente

jobs:
  ponto:
    runs-on: ubuntu-latest
    env:
      TZ: "America/Sao_Paulo"
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências e Navegador
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Executar Registro de Ponto
        env:
          SOLIDES_COMPANY_CODE: ${{ secrets.SOLIDES_COMPANY_CODE }}
          SOLIDES_PIN: ${{ secrets.SOLIDES_PIN }}
        run: python bater_ponto.py

      - name: Salvar Comprovante (Print)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprovante-ponto-${{ github.run_id }}
          path: comprovante_ponto.png
